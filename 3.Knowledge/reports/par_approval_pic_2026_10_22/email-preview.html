<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#f8fafc;padding:24px;font-family:system-ui}.preview{width:360px;max-width:100%}.par-detail-panel {
  display: grid;
  gap: 12px;
}

.par-detail-hero {
  display: flex;
  align-items: stretch;
  justify-content: space-between;
  gap: 16px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 16px 20px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.05);
}

.par-detail-hero h1 {
  margin: 8px 0 0;
  color: #0f172a;
  font-size: clamp(1.35rem, 2.5vw, 1.85rem);
  font-weight: 900;
  letter-spacing: -0.01em;
}

.par-detail-hero p {
  margin: 4px 0 0;
  color: #64748b;
  font-weight: 700;
  font-size: 0.84rem;
}

.par-detail-actions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
}

.par-detail-sections {
  display: grid;
  gap: 10px;
}

.par-detail-section {
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 12px 16px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}

.par-detail-section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 0 0 10px;
}

.par-detail-section h2 {
  margin: 0 0 10px;
  color: #0f172a;
  font-size: 0.92rem;
  font-weight: 850;
}

.par-detail-section-head h2 {
  display: inline-flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0;
}

.par-detail-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.par-detail-grid.is-par-header-grid {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}

.par-detail-grid.is-paid-to-grid {
  grid-template-columns: repeat(4, minmax(0, 1fr));
}

.par-detail-field {
  display: grid;
  gap: 3px;
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  padding: 8px 12px;
  background: #f8fafc;
}

.par-detail-field small {
  color: #64748b;
  font-size: 0.67rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.par-detail-field strong {
  color: #0f172a;
  font-size: 0.85rem;
  font-weight: 750;
  overflow-wrap: anywhere;
}

.par-detail-field.is-doc-no {
  border-left: 3px solid #2563eb;
  background: #f0f7ff;
}

.par-detail-field.is-doc-no small {
  color: #1d4ed8;
  font-weight: 850;
}

.par-detail-field.is-doc-no strong {
  color: #1e3a8a;
  font-size: 0.95rem;
  font-weight: 900;
  letter-spacing: 0.02em;
}

.par-assignment-field-editor {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px;
  align-items: center;
}

.par-assignment-field-editor input,
.par-assignment-field-editor select,
.par-assignment-field-editor textarea {
  min-width: 0;
  border: 1px solid #cbd5e1;
  border-radius: 5px;
  background: #fff;
  color: #0f172a;
  font: inherit;
  font-size: 0.84rem;
}

.par-assignment-field-editor input,
.par-assignment-field-editor select {
  height: 30px;
  padding: 0 8px;
}

.par-assignment-field-editor input.par-amount-input {
  text-align: right;
}

.par-assignment-field-editor textarea {
  min-height: 58px;
  padding: 7px 8px;
  resize: vertical;
}

.par-assignment-field-editor button {
  height: 30px;
  border: 1px solid #2563eb;
  border-radius: 5px;
  padding: 0 10px;
  background: #2563eb;
  color: #fff;
  font-size: 0.74rem;
  font-weight: 850;
}

.par-assignment-field-editor button:disabled {
  cursor: not-allowed;
  opacity: 0.6;
}

.par-span-2 {
  grid-column: span 2;
}

.par-span-3 {
  grid-column: span 3;
}

.par-span-4 {
  grid-column: span 4;
}

.par-detail-grid.is-par-header-grid .par-detail-field {
  grid-column: span 1;
}

.par-approval-steps {
  display: grid;
  gap: 10px;
}

.par-approval-step {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 12px;
  border: 1px solid #e2e8f0;
  border-radius: 8px;
  padding: 13px;
  background: #f8fafc;
}

.par-approval-step>span {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 11px;
  background: #eef2ff;
  color: #4f46e5;
  font-weight: 950;
}

.par-approval-step strong,
.par-approval-step small,
.par-approval-step em {
  display: block;
}

.par-approval-step strong {
  color: #0f172a;
  font-weight: 950;
}

.par-approval-step small,
.par-approval-step em,
.par-approval-step p {
  color: #64748b;
  font-size: 0.8rem;
  font-style: normal;
  font-weight: 750;
}

.par-approval-step p {
  margin: 5px 0 0;
}


.par-hots-assignment-header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
}

.par-hots-assignment-header h1 {
  margin: 0;
  color: #202333;
  font-size: clamp(1.35rem, 2vw, 1.75rem);
  font-weight: 900;
  letter-spacing: 0;
}

.par-hots-assignment-header p {
  margin: 4px 0 0;
  color: #4b5563;
  font-size: 0.92rem;
}

.par-hots-assignment-header>span {
  border-radius: 999px;
  padding: 4px 12px;
  background: #0b74d1;
  color: #fff;
  font-size: 0.72rem;
  font-weight: 900;
  text-transform: uppercase;
}

.par-hots-back {
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border: 1px solid #dfe3ea;
  border-radius: 6px;
  background: #fff;
  color: #111827;
  text-decoration: none;
  font-size: 1.35rem;
  font: inherit;
  cursor: pointer;
}

.par-related-sheet-tabs {
  display: flex;
  align-items: flex-end;
  gap: 0;
  width: fit-content;
  max-width: 100%;
  margin: 0;
  overflow-x: auto;
  border: 1px solid #d8e1ef;
  border-radius: 6px;
  background: #eef2f7;
}

.par-related-sheet-dock {
  display: flex;
  align-items: flex-end;
  min-width: 0;
  margin: -12px 0 -18px 0;
  position: relative;
  z-index: 2;
}

.par-related-sheet-dock .par-related-sheet-tabs {
  border-bottom-color: #fff;
  border-bottom-left-radius: 0;
  border-bottom-right-radius: 0;
}

.par-related-sheet-tab {
  display: inline-flex;
  flex: 0 0 auto;
  flex-direction: column;
  justify-content: center;
  min-width: 128px;
  min-height: 36px;
  border-right: 1px solid #d8e1ef;
  padding: 6px 12px;
  color: #334155;
  background: transparent;
}

.par-related-sheet-tab:last-child {
  border-right: 0;
}

.par-related-sheet-tab strong {
  color: inherit;
  font-size: 0.78rem;
  font-weight: 900;
  line-height: 1.1;
}

.par-related-sheet-tab small {
  margin-top: 2px;
  color: #64748b;
  font-size: 0.65rem;
  font-weight: 800;
  line-height: 1.1;
}

.par-related-sheet-tab.is-active {
  border-top: 2px solid #0f766e;
  background: #fff;
  color: #0f172a;
}

.par-related-sheet-tab.is-disabled {
  cursor: default;
}

.par-hots-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  overflow: hidden;
  border-radius: 6px;
  background: #e9ebef;
  padding: 4px;
}

.par-hots-tabs button {
  border: 0;
  border-radius: 4px;
  background: transparent;
  padding: 9px 12px;
  color: #111827;
  font: inherit;
  font-weight: 750;
}

.par-hots-tabs button.is-active {
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.06);
}

.par-hots-assignment-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 22px;
  align-items: start;
}

.par-hots-work-main {
  display: grid;
  gap: 0;
  min-width: 0;
}

.par-hots-work-main .par-detail-section {
  border-radius: 6px;
  box-shadow: none;
}

.par-widget-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 8px;
}

.par-widget-header strong {
  color: #111827;
  font-weight: 850;
}

.par-widget-header small,
.par-widget-header span {
  color: #475569;
  font-size: 0.78rem;
}

.par-widget-header i {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-right: 6px;
  border-radius: 999px;
  background: #10b981;
}

.par-hots-sidebar {
  display: grid;
  gap: 18px;
}

.par-hots-sidebar section {
  overflow: hidden;
  border: 1px solid #dfe3ea;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}

.par-hots-sidebar h3 {
  margin: 0;
  border-bottom: 1px solid #e5e7eb;
  padding: 15px 16px;
  color: #111827;
  font-size: 0.92rem;
  font-weight: 850;
}

.par-hots-sidebar dl {
  margin: 0;
  padding: 8px 16px 14px;
}

.par-hots-sidebar dl div {
  display: grid;
  grid-template-columns: 110px minmax(0, 1fr);
  gap: 16px;
  border-bottom: 1px solid #e5e7eb;
  padding: 13px 0;
}

.par-hots-sidebar dt {
  color: #334155;
}

.par-hots-sidebar dd {
  margin: 0;
  color: #111827;
  font-weight: 750;
}

.par-hots-sidebar a {
  display: block;
  margin: 0 16px 16px;
  border: 1px solid #dfe3ea;
  border-radius: 6px;
  padding: 10px;
  color: #111827;
  text-align: center;
  text-decoration: none;
  font-weight: 800;
}

.par-hots-card {
  border: 1px solid #dfe3ea;
  border-radius: 8px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}

.par-ticket-detail-header {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 14px;
}

.par-ticket-detail-header h1 {
  margin: 0;
  color: #202333;
  font-size: clamp(1.45rem, 2vw, 1.85rem);
  font-weight: 900;
  letter-spacing: 0;
}

.par-ticket-detail-header p {
  margin: 4px 0 0;
  color: #4b5563;
  font-size: 0.92rem;
}

.par-ticket-detail-header>span {
  border-radius: 999px;
  padding: 5px 12px;
  background: #0b74d1;
  color: #fff;
  font-size: 0.72rem;
  font-weight: 900;
  text-transform: uppercase;
}

.par-title-current-approver {
  display: grid;
  gap: 1px;
  min-width: 132px;
  text-align: right;
}

.par-title-current-approver small {
  color: #64748b;
  font-size: 0.62rem;
  font-weight: 850;
  letter-spacing: 0.06em;
  line-height: 1;
  text-transform: uppercase;
}

.par-title-current-approver strong {
  color: #0f172a;
  font-size: 0.82rem;
  font-weight: 850;
  line-height: 1.15;
}

.par-title-current-approver span {
  color: #0b74d1;
  font-size: 0.68rem;
  font-weight: 850;
  line-height: 1.1;
}

.par-title-status-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 24px;
  border: 1px solid #bae6fd;
  border-radius: 999px;
  padding: 4px 11px;
  background: #f0f9ff;
  color: #0369a1;
  font-size: 0.76rem;
  font-weight: 850;
  white-space: nowrap;
}

.par-payment-execution-widget {
  padding: 14px;
}

.par-payment-execution-widget header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 12px;
}

.par-payment-execution-widget h3 {
  margin: 0;
  color: #0f172a;
  font-size: 0.98rem;
  font-weight: 900;
}

.par-payment-execution-widget p {
  margin: 3px 0 0;
  color: #64748b;
  font-size: 0.78rem;
  font-weight: 700;
}

.par-payment-action-button,
.par-payment-complete-button {
  border-radius: 6px;
  min-height: 38px;
  padding: 0 14px;
  font-size: 0.82rem;
  font-weight: 900;
  cursor: pointer;
  width: 100%;
}

.par-payment-action-button {
  border: 1px solid #16a34a;
  background: #16a34a;
  color: #fff;
}

.par-payment-complete-button {
  border: 1px solid #cbd5e1;
  background: #fff;
  color: #0f172a;
}

.par-payment-action-button:disabled,
.par-payment-complete-button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.par-payment-execution-grid {
  display: grid;
  gap: 8px;
}

.par-payment-execution-grid div {
  border: 1px solid #e2e8f0;
  border-radius: 6px;
  background: #f8fafc;
  padding: 9px 10px;
}

.par-payment-execution-grid small {
  display: block;
  color: #64748b;
  font-size: 0.66rem;
  font-weight: 850;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.par-payment-execution-grid strong {
  display: block;
  margin-top: 3px;
  color: #0f172a;
  font-size: 0.84rem;
  font-weight: 850;
}

.par-payment-modal {
  width: min(560px, calc(100vw - 32px));
}

.par-payment-modal .par-supporting-documents {
  margin: 12px 0 0;
  box-shadow: none;
}

.par-payment-toast {
  border: 1px solid #fecaca;
  border-radius: 6px;
  background: #fff7f7;
  color: #b91c1c;
  margin: 0 0 12px;
  padding: 9px 11px;
  font-size: 0.82rem;
  font-weight: 850;
}

.par-payment-toast.is-success {
  border-color: #bbf7d0;
  background: #f0fdf4;
  color: #166534;
}

.par-payment-date-field {
  display: grid;
  gap: 7px;
  margin-top: 12px;
}

.par-payment-date-field span {
  color: #475569;
  font-size: 0.72rem;
  font-weight: 900;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.par-payment-date-field input {
  border: 1px solid #cbd5e1;
  border-radius: 6px;
  min-height: 40px;
  padding: 0 10px;
  color: #0f172a;
  font: inherit;
  font-size: 0.88rem;
}

.par-ticket-detail-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 360px;
  gap: 22px;
  align-items: start;
}

.par-ticket-main,
.par-ticket-sidebar,
.par-ticket-widget-stack {
  display: grid;
  gap: 18px;
  min-width: 0;
}

.par-request-info,
.par-ticket-documents,
.par-ticket-approval-card,
.par-hots-tab-panel {
  padding: 16px;
}

.par-request-info h3,
.par-ticket-documents h3,
.par-ticket-approval-card h3,
.par-hots-tab-panel h2 {
  margin: 0;
  color: #111827;
  font-size: 0.95rem;
  font-weight: 850;
}

.par-approval-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}

.par-ticket-approval-card .par-approval-card-header h3 {
  margin-bottom: 0;
}

.par-approval-cancel-button {
  border: 1px solid #fecaca;
  border-radius: 6px;
  background: #fff7f7;
  color: #b91c1c;
  font-size: 0.78rem;
  font-weight: 850;
  padding: 7px 10px;
  cursor: pointer;
}

.par-approval-cancel-button:hover {
  border-color: #fca5a5;
  background: #fee2e2;
}

.par-request-info-head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 16px;
}

.par-request-info-head p,
.par-ticket-documents>p,
.par-hots-tab-panel header p {
  margin: 4px 0 0;
  color: #475569;
  font-size: 0.82rem;
}

.par-request-edit-button {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  flex: 0 0 auto;
  border: 1px solid #dbe3ee;
  border-radius: 6px;
  background: #fff;
  padding: 8px 11px;
  color: #0b55c9;
  font-size: 0.78rem;
  font-weight: 850;
  text-decoration: none;
}

.par-jump-top-widget {
  position: fixed;
  right: 420px;
  bottom: 34px;
  z-index: 96;
  display: grid;
  place-items: center;
  width: 46px;
  height: 46px;
  border: 1px solid #bfd4ec;
  border-radius: 999px;
  background: #fff;
  color: #0b55c9;
  box-shadow: 0 14px 35px rgba(15, 23, 42, 0.18);
  cursor: pointer;
}

.par-jump-top-widget.is-chat-minimized {
  right: 320px;
  bottom: 72px;
}

.par-jump-top-widget.is-chat-expanded {
  right: 420px;
  bottom: 34px;
}

.par-jump-top-widget:hover {
  border-color: #0b74d1;
  background: #eff6ff;
}

@media (max-width: 520px) {
  .par-jump-top-widget,
  .par-jump-top-widget.is-chat-expanded,
  .par-jump-top-widget.is-chat-minimized {
    right: auto;
    left: 12px;
    bottom: 72px;
  }
}

.par-request-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  border-top: 1px solid #f1f5f9;
  padding-top: 10px;
  align-items: center;
}

.par-request-grid div {
  display: grid;
  gap: 3px;
}

.par-request-grid small {
  color: #64748b;
  font-size: 0.7rem;
  font-weight: 750;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.par-request-grid strong {
  color: #0f172a;
  font-size: 0.88rem;
  font-weight: 800;
}

.par-soft-status {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 22px;
  padding: 0 8px;
  border-radius: 4px;
  font-size: 0.72rem !important;
  font-weight: 750;
  line-height: 1;
  white-space: nowrap;
  border: 1px solid #e2e8f0;
  background: #f8fafc;
  color: #475569 !important;
}

.par-soft-status.is-process,
.par-soft-status.is-active {
  background: #f0f9ff;
  color: #0284c7 !important;
  border-color: #bae6fd;
}

.par-soft-status.is-approved,
.par-soft-status.is-completed,
.par-soft-status.is-paid {
  background: #f0fdf4;
  color: #16a34a !important;
  border-color: #bbf7d0;
}

.par-soft-status.is-wait,
.par-soft-status.is-pending {
  background: #fffbeb;
  color: #d97706 !important;
  border-color: #fde68a;
}

.par-soft-status.is-rejected,
.par-soft-status.is-cancelled {
  background: #fef2f2;
  color: #dc2626 !important;
  border-color: #fecaca;
}

.par-current-pic-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
}

.par-current-pic-wrap strong {
  font-size: 0.85rem !important;
  color: #0f172a;
}

.par-current-pic-wrap .par-mini-step-text {
  font-size: 0.7rem;
  color: #64748b;
  font-weight: 700;
}

.par-document-empty,
.par-muted {
  border: 1px solid #dfe3ea;
  border-radius: 6px;
  background: #f8fafc;
  padding: 14px;
  color: #64748b;
  font-size: 0.82rem;
}

.par-document-empty.is-error {
  border-color: #fecaca;
  background: #fff7f7;
  color: #b91c1c;
}

.par-documents-widget,
.par-supporting-documents {
  display: grid;
  gap: 12px;
  padding: 16px;
}

.par-documents-widget>header,
.par-supporting-documents>header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
  border-bottom: 1px solid #e5e7eb;
  padding-bottom: 14px;
}

.par-documents-widget h3,
.par-supporting-documents h3 {
  margin: 0;
  color: #111827;
  font-size: 0.95rem;
  font-weight: 850;
}

.par-documents-widget header p,
.par-supporting-documents header p,
.par-document-note {
  margin: 4px 0 0;
  color: #475569;
  font-size: 0.82rem;
  line-height: 1.5;
}

.par-documents-widget header button {
